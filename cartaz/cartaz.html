<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartaz — Doce Camomila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  /* QR: https://docecamomila.pages.dev (gerado com qrcode, correção Q). Para imprimir: abrir no navegador → Imprimir → A4, sem margens. */
  /* Cartaz A4 da bancada (identidade "Miolo", decisão 005). Fundo branco para economizar tinta. */
  @page { size: A4; margin: 0 }
  * { box-sizing: border-box }
  html, body { margin: 0; background: #fff; color: #1F1E16; -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .folha {
    width: 210mm; height: 297mm; padding: 18mm 18mm 14mm;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  .marca { display: flex; align-items: center; gap: 5mm }
  .marca svg { width: 22mm; height: 22mm }
  .marca b { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 13mm; letter-spacing: -.01em }
  .qr {
    margin-top: 18mm; margin-bottom: 12mm; padding: 9mm; border: 1.2mm solid #1F1E16; border-radius: 9mm; background: #fff;
    box-shadow: 0 0 0 3mm #F6C432;
  }
  .qr svg { display: block; width: 134mm; height: 134mm }
  .passos { margin-top: auto; display: flex; gap: 6mm; width: 100% }
  .passo { flex: 1; border: .6mm solid #E2DFD2; border-radius: 5mm; padding: 5mm 4mm; display: flex; flex-direction: column; align-items: center; gap: 2mm }
  .passo i { font-style: normal; width: 11mm; height: 11mm; border-radius: 50%; background: #F6C432; display: grid; place-items: center;
             font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 6.5mm }
  .passo p { margin: 0; font-size: 5.6mm; line-height: 1.2; font-weight: 700 }
</style>
</head>
<body>
<div class="folha">
  <div class="marca">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <g fill="#FFFFFF" stroke="#1F1E16" stroke-width="1.6">
        <ellipse cx="24" cy="10" rx="5.2" ry="9"/>
        <ellipse cx="24" cy="10" rx="5.2" ry="9" transform="rotate(45 24 24)"/>
        <ellipse cx="24" cy="10" rx="5.2" ry="9" transform="rotate(90 24 24)"/>
        <ellipse cx="24" cy="10" rx="5.2" ry="9" transform="rotate(135 24 24)"/>

        <ellipse cx="24" cy="10" rx="5.2" ry="9" transform="rotate(315 24 24)"/>

      <circle cx="24" cy="24" r="9" fill="#F6C432" stroke="#1F1E16" stroke-width="1.6"/>
    </svg>

  </div>

</div>

  <div class="passos">
    <div class="passo"><i>1</i><p>Aponte a câmera do celular</p></div>
